name: Wire OpenAI OAuth Runtime

on:
  push:
    branches:
      - chatgpt/openai-device-auth-v1
    paths:
      - '.github/workflows/wire-openai-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/openai-device-auth-v1
          fetch-depth: 0

      - name: Add runtime headers plumbing
        shell: python
        run: |
          from pathlib import Path

          path = Path('agent-runtime/src/main/java/com/niki914/zafiro/chat/LLMController.kt')
          text = path.read_text()

          replacements = [
              (
                  '            proxy = llmConfig.proxy,\n'
                  '            idleTimeoutSeconds = llmConfig.idleTimeoutSeconds,',
                  '            proxy = llmConfig.proxy,\n'
                  '            headers = llmConfig.headers,\n'
                  '            idleTimeoutSeconds = llmConfig.idleTimeoutSeconds,',
              ),
              (
                  '            model = configWithoutRuntimePrompt.model\n'
                  '            // 热更新超时/重试策略',
                  '            model = configWithoutRuntimePrompt.model\n'
                  '            headers = configWithoutRuntimePrompt.headers\n'
                  '            // 热更新超时/重试策略',
              ),
              (
                  '            model = config.model\n'
                  '            hooks += killToolResourcesHook',
                  '            model = config.model\n'
                  '            headers = config.headers\n'
                  '            hooks += killToolResourcesHook',
              ),
          ]

          changed = False
          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'Expected source block not found:\n{old}')
              text = text.replace(old, new, 1)
              changed = True

          if changed:
              path.write_text(text)
              print('Runtime headers plumbing applied.')
          else:
              print('Runtime headers plumbing already present.')

      - name: Commit generated source change
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent-runtime/src/main/java/com/niki914/zafiro/chat/LLMController.kt
          git commit -m 'feat(openai): pass managed OAuth headers into Okia runtime'
          git push origin HEAD:chatgpt/openai-device-auth-v1
